name: Daily SEO Sync

on:
  schedule:
    - cron: '0 19 * * *'  # 02:00 ICT (UTC+7)
  workflow_dispatch:        # allow manual trigger from GitHub UI

jobs:
  sync-gsc:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger GSC Sync
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST https://${{ vars.APP_URL }}/api/cron/sync-gsc \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          body=$(echo "$response" | head -n -1)
          code=$(echo "$response" | tail -n1)
          echo "HTTP $code — $body"
          [ "$code" -lt 400 ]
          BODY="$body" node - <<'NODE'
          const body = JSON.parse(process.env.BODY || '{}');
          if (body.ok === false || (Array.isArray(body.errors) && body.errors.length > 0)) {
            console.error('GSC sync failed at business-result layer:', JSON.stringify(body));
            process.exit(1);
          }
          NODE

  sync-ga4:
    runs-on: ubuntu-latest
    needs: sync-gsc
    if: always()     # GA4 sync is independent — run even if GSC fails
    steps:
      - name: Trigger GA4 Sync
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST https://${{ vars.APP_URL }}/api/cron/sync-ga4 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          body=$(echo "$response" | head -n -1)
          code=$(echo "$response" | tail -n1)
          echo "HTTP $code — $body"
          [ "$code" -lt 400 ]
          BODY="$body" node - <<'NODE'
          const body = JSON.parse(process.env.BODY || '{}');
          if (body.ok === false || (Array.isArray(body.errors) && body.errors.length > 0)) {
            console.error('GA4 sync failed at business-result layer:', JSON.stringify(body));
            process.exit(1);
          }
          NODE

  run-alerts:
    runs-on: ubuntu-latest
    needs: [sync-gsc, sync-ga4]
    steps:
      - name: Trigger Alert Engine
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST https://${{ vars.APP_URL }}/api/cron/run-alerts \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          body=$(echo "$response" | head -n -1)
          code=$(echo "$response" | tail -n1)
          echo "HTTP $code — $body"
          [ "$code" -lt 400 ]
          BODY="$body" node - <<'NODE'
          const body = JSON.parse(process.env.BODY || '{}');
          if (body.ok === false || (Array.isArray(body.errors) && body.errors.length > 0)) {
            console.error('Alert engine failed at business-result layer:', JSON.stringify(body));
            process.exit(1);
          }
          NODE

  weekly-digest:
    runs-on: ubuntu-latest
    needs: run-alerts
    # Only runs on Sundays or when manually dispatched.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - name: Check if Sunday
        id: day_check
        run: |
          DOW=$(date -u +%u)   # 1=Mon … 7=Sun
          echo "day_of_week=$DOW" >> "$GITHUB_OUTPUT"
          echo "Day of week (ISO): $DOW"

      - name: Trigger Weekly Digest
        if: steps.day_check.outputs.day_of_week == '7' || github.event_name == 'workflow_dispatch'
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST https://${{ vars.APP_URL }}/api/cron/weekly-digest \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          body=$(echo "$response" | head -n -1)
          code=$(echo "$response" | tail -n1)
          echo "HTTP $code — $body"
          [ "$code" -lt 400 ]
          BODY="$body" node - <<'NODE'
          const body = JSON.parse(process.env.BODY || '{}');
          if (body.ok === false || (Array.isArray(body.errors) && body.errors.length > 0)) {
            console.error('Weekly digest failed at business-result layer:', JSON.stringify(body));
            process.exit(1);
          }
          NODE
